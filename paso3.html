class Cym{constructor(c,o={}){this.c=c;this.x=c.getContext('2d');Object.assign(this,{m:4,k:4,col:'#f4f4f0',n:1300,bf:.1,amp:.03},o);this.t=0;this.s=1;
 this.p=Array.from({length:this.n},()=>{const a=Math.random()*6.283,r=Math.sqrt(Math.random());return[Math.cos(a)*r,Math.sin(a)*r]});
 this.rs();for(let i=0;i<70;i++)this.step();this.draw();Cym.all.push(this);new IntersectionObserver(e=>this.vis=e[0].isIntersecting).observe(c);this.vis=true;addEventListener('resize',()=>{this.rs();this.draw()})}
rs(){const d=Math.min(devicePixelRatio||1,2),w=this.c.clientWidth||300;this.c.width=this.c.height=Math.round(w*d);this.d=d}
f(x,y){const r=Math.hypot(x,y)/this.s;return Math.cos(this.m*Math.atan2(y,x))*Math.sin(this.k*Math.PI*r)}
step(){this.s=1+this.amp*Math.sin(this.t*6.283*this.bf);const e=.008;
 for(const q of this.p){const v=this.f(q[0],q[1]),fx=(this.f(q[0]+e,q[1])-this.f(q[0]-e,q[1]))/(2*e),fy=(this.f(q[0],q[1]+e)-this.f(q[0],q[1]-e))/(2*e),g=fx*fx+fy*fy+.05;
 let dx=-v*fx/g*.3,dy=-v*fy/g*.3;const m=Math.hypot(dx,dy);if(m>.04){dx*=.04/m;dy*=.04/m}
 q[0]+=dx+(Math.random()-.5)*.01;q[1]+=dy+(Math.random()-.5)*.01;
 if(q[0]*q[0]+q[1]*q[1]>1){const a=Math.random()*6.283,r=Math.sqrt(Math.random());q[0]=Math.cos(a)*r;q[1]=Math.sin(a)*r}}}
draw(){const W=this.c.width,d=this.d,x=this.x;x.clearRect(0,0,W,W);x.fillStyle=this.col;x.globalAlpha=.75;
 for(const q of this.p)x.fillRect((q[0]*this.s+1)/2*W,(q[1]*this.s+1)/2*W,d*1.3,d*1.3);x.globalAlpha=1}
set(o){Object.assign(this,o);for(let i=0;i<70;i++)this.step();this.draw()}}

let last=0;function loop(ts){const dt=Math.min((ts-last)/1000||.016,.05);last=ts;

 drift(dt);requestAnimationFrame(loop)}

 if(x.createStereoPanner){const p=x.createStereoPanner();p.pan.value=pan;o.connect(p);p.connect(dest)}else o.connect(dest);o.start();return o}
